<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML Media · 布局编辑器</title><link rel="stylesheet" href="/editor.css"></head>
<body>
<header><div class="brand">H<span>m</span></div><div><strong>HTML Media</strong><small>场景布局与动画预览 · Layout studio</small></div><div class="badge">可编辑源码 / EDITABLE SOURCE</div></header>
<nav aria-label="编辑工具"><button id="undo" disabled>↶ 撤销 Undo</button><button id="redo" disabled>↷ 重做 Redo</button><span class="divider"></span><button id="group" disabled>组合 Group</button><button id="ungroup" disabled>取消组合</button><button id="reset" disabled>恢复初稿</button><span class="spacer"></span><button id="save" class="primary" disabled>保存布局 Save</button></nav>
<main><section id="scene-panel" class="scene-panel" hidden><div class="section-label">SCENES / 场景</div><div id="scenes"></div></section><section class="workspace"><div class="canvas-heading"><span id="scene-name">01 / 布局画布</span><span id="dimensions"></span></div><div class="view-controls"><label>查看方式<select id="mode"><option value="layout">布局编辑</option><option value="preview">播放预览</option></select></label><label>布局步骤<select id="step"><option value="">完整布局</option></select></label></div><div id="viewport"><div id="sizer"><div id="stage"><iframe id="scene" title="场景预览"></iframe><div id="overlay" aria-label="可拖动布局"><div id="guide-x" class="guide vertical" hidden></div><div id="guide-y" class="guide horizontal" hidden></div></div></div></div></div><div class="transport"><button id="restart" disabled aria-label="回到开头">↤</button><button id="play" disabled>▶ 播放</button><input id="seek" type="range" min="0" max="4" step="0.04" value="0" aria-label="播放进度" disabled><output id="time-label">0.00 / 4.00 s</output></div><p class="hint">布局模式可拖动 · Shift 点击多选 · 方向键微调 · 播放预览中暂停或拖动进度检查动画</p><div id="status" role="status" aria-live="polite">正在准备场景…</div></section>
<aside><section><div class="section-label">ELEMENTS / 元素</div><div id="layers"></div></section><section><div class="section-label">POSITION / 位置</div><p id="selection-label">选择画布中的元素</p><div class="coordinates"><label>X<input id="x" type="number" step="1" disabled></label><label>Y<input id="y" type="number" step="1" disabled></label></div><p class="subtle">图标与文字保持一起移动。组合后可一起调整多个元素。</p></section><section><div class="section-label">EXPORT / 导出</div><label class="format-label">输出格式<select id="format"><option value="png">PNG 图片</option><option value="jpg">JPEG 图片</option><option value="mp4">MP4 无声视频</option></select></label><p id="export-spec" class="subtle"></p><button id="export" class="dark" disabled>按当前布局导出</button><p class="subtle">每次保存或导出都会创建新文件，保留之前的版本。</p><div id="results"></div></section></aside></main>
<script src="/session.js"></script><script src="/editor.js"></script>
</body></html>
