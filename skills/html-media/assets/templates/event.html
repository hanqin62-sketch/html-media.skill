<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<title>Configurable event poster / 可配置活动海报</title>
<style>
:root{--paper:#f4eee4;--ink:#233d35;--accent:#ad5037;--title-size:64px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.frame{position:absolute;inset:48px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink)}
#label{position:absolute;left:64px;top:78px;font-size:17px;letter-spacing:3px;color:var(--accent)}
#title{position:absolute;left:64px;top:200px;width:670px;margin:0;font-size:var(--title-size);font-weight:700;line-height:1.45}
#description{position:absolute;left:68px;top:330px;width:600px;font-size:25px;line-height:1.7}
#details{position:absolute;left:68px;top:480px;font-size:20px;line-height:1.8}
#price{position:absolute;left:68px;bottom:86px;font-size:32px;font-weight:700;color:var(--accent)}
#hero{position:absolute;right:64px;top:170px;width:420px;height:420px;object-fit:cover;border-radius:50% 50% 3px 3px}
.footer{position:absolute;right:64px;bottom:74px;font-size:13px;letter-spacing:2px}
</style>
<div class="frame"></div><div id="label"></div><h1 id="title"></h1>
<div id="description"></div><div id="details"></div><div id="price"></div>
<img id="hero" alt=""><div class="footer">HTML MEDIA / CONFIG STUDY</div>
</html>
