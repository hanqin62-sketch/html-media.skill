name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux system libraries
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Install FFmpeg and Chinese fonts on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $env:Path = "$env:ChocolateyInstall\bin;$env:Path"
          "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          ffmpeg -version
          ffprobe -version
      - run: npm run validate
      - run: npm test
      - name: Install self-contained skill
        run: node scripts/install.cjs --dest "${{ runner.temp }}/html-media"
      - name: Install standalone skill dependencies
        run: npm ci --prefix "${{ runner.temp }}/html-media"
      - name: Render with standalone installation
        run: node "${{ runner.temp }}/html-media/scripts/render.cjs" --html "${{ runner.temp }}/html-media/assets/scene.html" --out outputs/installed.png --width 1280 --height 720 --time 1.5
      - run: npm run demo:image
      - run: npm run demo:video
