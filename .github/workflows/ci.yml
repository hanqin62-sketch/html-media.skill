name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux system libraries
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Install FFmpeg and Chinese fonts on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pin Gyan's release archive and checksum; avoid Chocolatey's package feed.
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          curl.exe --fail --location --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 300 --output $archive 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip'
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg download failed' }
          $expectedHash = '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'FFmpeg archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $ffmpegBin = Join-Path $destination 'ffmpeg-9.0.2-essentials_build\bin'
          $env:Path = "$ffmpegBin;$env:Path"
          $ffmpegBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg verification failed' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe verification failed' }
      - run: npm run validate
      - run: npm test
      - name: Install self-contained skill
        run: node scripts/install.cjs --dest "${{ runner.temp }}/html-media"
      - name: Install standalone skill dependencies
        run: npm ci --prefix "${{ runner.temp }}/html-media"
      - name: Render with standalone installation
        run: node "${{ runner.temp }}/html-media/scripts/render.cjs" --html "${{ runner.temp }}/html-media/assets/scene.html" --out outputs/installed.png --width 1280 --height 720 --time 1.5
      - run: npm run demo:image
      - run: npm run demo:video
      - run: npm run demo:checked
      - run: npm run demo:config
      - run: npm run demo:batch
